
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'EgyptianDadCommunity-mobile-build.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip EgyptianDadCommunity-mobile-build.zip
          cd EgyptianDadCommunity
          chmod +x gradlew

      - name: Build APK
        run: |
          cd EgyptianDadCommunity
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EgyptianDadCommunity-APK
          path: EgyptianDadCommunity/app/build/outputs/apk/debug/*.apk
